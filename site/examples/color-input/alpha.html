<!-- title: 透明度も選ぶ（alpha） -->
<div class="stack">
  <jimble-field label="ハイライトの色" hint="透けた色は #rrggbbaa で送信されます">
    <jimble-color-input name="highlight" alpha value="#facc1580"></jimble-color-input>
  </jimble-field>
  <jimble-field label="帯の色">
    <jimble-color-input
      name="band"
      alpha
      value="#4f46e5"
      presets="#4f46e5 #4f46e5b3 #4f46e566 #4f46e51a #00000080 #ffffff80"
    ></jimble-color-input>
  </jimble-field>
</div>
