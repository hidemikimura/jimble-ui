<!-- title: 見出しのない補足（label で名前を付ける） -->
<jimble-popover label="キーボードの操作" style="--jimble-popover-width: 16rem">
  <jimble-button slot="trigger" variant="ghost">
    <jimble-icon slot="prefix" name="command-line"></jimble-icon>ショートカット
  </jimble-button>
  <jimble-description-list>
    <jimble-description-item label="保存">Ctrl + S</jimble-description-item>
    <jimble-description-item label="検索">Ctrl + K</jimble-description-item>
    <jimble-description-item label="閉じる">Esc</jimble-description-item>
  </jimble-description-list>
</jimble-popover>
