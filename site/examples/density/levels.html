<!-- title: 4 つの段階を並べて比べる（data-jimble-density を、それぞれの section に付けている） -->
<jimble-grid min-column-width="15rem">
  <section data-jimble-density="compact" aria-label="compact">
    <jimble-card>
      <strong slot="header">compact</strong>
      <jimble-stack gap="3">
        <jimble-field label="氏名"><jimble-input value="山田 太郎"></jimble-input></jimble-field>
        <jimble-checkbox checked>お知らせを受け取る</jimble-checkbox>
        <jimble-stack direction="horizontal" gap="2" justify="end">
          <jimble-button>取り消す</jimble-button>
          <jimble-button variant="primary">保存</jimble-button>
        </jimble-stack>
      </jimble-stack>
    </jimble-card>
  </section>
  <section data-jimble-density="default" aria-label="default">
    <jimble-card>
      <strong slot="header">default</strong>
      <jimble-stack gap="3">
        <jimble-field label="氏名"><jimble-input value="山田 太郎"></jimble-input></jimble-field>
        <jimble-checkbox checked>お知らせを受け取る</jimble-checkbox>
        <jimble-stack direction="horizontal" gap="2" justify="end">
          <jimble-button>取り消す</jimble-button>
          <jimble-button variant="primary">保存</jimble-button>
        </jimble-stack>
      </jimble-stack>
    </jimble-card>
  </section>
  <section data-jimble-density="comfortable" aria-label="comfortable">
    <jimble-card>
      <strong slot="header">comfortable</strong>
      <jimble-stack gap="3">
        <jimble-field label="氏名"><jimble-input value="山田 太郎"></jimble-input></jimble-field>
        <jimble-checkbox checked>お知らせを受け取る</jimble-checkbox>
        <jimble-stack direction="horizontal" gap="2" justify="end">
          <jimble-button>取り消す</jimble-button>
          <jimble-button variant="primary">保存</jimble-button>
        </jimble-stack>
      </jimble-stack>
    </jimble-card>
  </section>
  <section data-jimble-density="spacious" aria-label="spacious">
    <jimble-card>
      <strong slot="header">spacious</strong>
      <jimble-stack gap="3">
        <jimble-field label="氏名"><jimble-input value="山田 太郎"></jimble-input></jimble-field>
        <jimble-checkbox checked>お知らせを受け取る</jimble-checkbox>
        <jimble-stack direction="horizontal" gap="2" justify="end">
          <jimble-button>取り消す</jimble-button>
          <jimble-button variant="primary">保存</jimble-button>
        </jimble-stack>
      </jimble-stack>
    </jimble-card>
  </section>
</jimble-grid>
