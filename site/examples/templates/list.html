<!-- title: 一覧（検索・絞り込み・表・行の操作・ページ送り） -->
<!-- frame: 760 -->
<jimble-app-shell sidebar-collapsible>
  <strong slot="header">jimble 管理画面</strong>

  <jimble-sidebar-nav slot="sidebar" label="メイン">
    <jimble-nav-item href="#"
      ><jimble-icon slot="icon" name="home"></jimble-icon>ダッシュボード</jimble-nav-item
    >
    <jimble-nav-item href="#" current
      ><jimble-icon slot="icon" name="shopping-cart"></jimble-icon>注文</jimble-nav-item
    >
    <jimble-nav-item href="#"
      ><jimble-icon slot="icon" name="users"></jimble-icon>顧客</jimble-nav-item
    >
    <jimble-nav-item href="#"
      ><jimble-icon slot="icon" name="cog-6-tooth"></jimble-icon>設定</jimble-nav-item
    >
  </jimble-sidebar-nav>

  <jimble-page-header heading="注文" description="受け付けた注文の一覧です。">
    <jimble-breadcrumb slot="breadcrumb">
      <jimble-breadcrumb-item href="#">ホーム</jimble-breadcrumb-item>
      <jimble-breadcrumb-item>注文</jimble-breadcrumb-item>
    </jimble-breadcrumb>
    <jimble-button slot="actions">
      <jimble-icon slot="prefix" name="arrow-down-tray"></jimble-icon>CSV に書き出す
    </jimble-button>
    <jimble-button slot="actions" variant="primary">
      <jimble-icon slot="prefix" name="plus"></jimble-icon>新規注文
    </jimble-button>
  </jimble-page-header>

  <jimble-card style="margin-top: 1rem">
    <form
      slot="header"
      role="search"
      aria-label="注文の絞り込み"
      style="display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end"
      onsubmit="
        event.preventDefault()
        JimbleUI.toast('絞り込みました')
      "
    >
      <jimble-field label="キーワード" style="flex: 1 1 14rem">
        <jimble-input name="q" type="search" placeholder="注文番号・顧客名">
          <jimble-icon slot="prefix" name="magnifying-glass"></jimble-icon>
        </jimble-input>
      </jimble-field>
      <jimble-field label="状態" style="flex: 0 1 12rem">
        <jimble-select name="status" value="all">
          <jimble-option value="all">すべて</jimble-option>
          <jimble-option value="new">新規</jimble-option>
          <jimble-option value="shipped">発送済み</jimble-option>
          <jimble-option value="canceled">取消</jimble-option>
        </jimble-select>
      </jimble-field>
      <jimble-button type="submit">絞り込む</jimble-button>
    </form>

    <jimble-table label="注文一覧">
      <jimble-table-header>
        <jimble-table-row>
          <jimble-table-head-cell sortable sort="descending">注文番号</jimble-table-head-cell>
          <jimble-table-head-cell>顧客</jimble-table-head-cell>
          <jimble-table-head-cell>状態</jimble-table-head-cell>
          <jimble-table-head-cell align="end">金額</jimble-table-head-cell>
          <jimble-table-head-cell align="end"
            ><span
              style="
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
              "
              >操作</span
            ></jimble-table-head-cell
          >
        </jimble-table-row>
      </jimble-table-header>
      <jimble-table-body>
        <jimble-table-row>
          <jimble-table-cell header><a href="#">#1024</a></jimble-table-cell>
          <jimble-table-cell>山田 太郎</jimble-table-cell>
          <jimble-table-cell><jimble-badge variant="info">新規</jimble-badge></jimble-table-cell>
          <jimble-table-cell align="end">¥12,800</jimble-table-cell>
          <jimble-table-cell align="end">
            <jimble-dropdown-menu placement="bottom-end" label="#1024 の操作">
              <jimble-button
                slot="trigger"
                variant="ghost"
                size="sm"
                icon-only
                aria-label="#1024 の操作"
              >
                <jimble-icon name="ellipsis-horizontal"></jimble-icon>
              </jimble-button>
              <jimble-menu-item value="edit">編集</jimble-menu-item>
              <jimble-menu-item value="copy">複製</jimble-menu-item>
              <jimble-menu-separator></jimble-menu-separator>
              <jimble-menu-item value="cancel" variant="danger">取り消す</jimble-menu-item>
            </jimble-dropdown-menu>
          </jimble-table-cell>
        </jimble-table-row>
        <jimble-table-row>
          <jimble-table-cell header><a href="#">#1023</a></jimble-table-cell>
          <jimble-table-cell>佐藤 花子</jimble-table-cell>
          <jimble-table-cell
            ><jimble-badge variant="success">発送済み</jimble-badge></jimble-table-cell
          >
          <jimble-table-cell align="end">¥3,400</jimble-table-cell>
          <jimble-table-cell align="end">
            <jimble-dropdown-menu placement="bottom-end" label="#1023 の操作">
              <jimble-button
                slot="trigger"
                variant="ghost"
                size="sm"
                icon-only
                aria-label="#1023 の操作"
              >
                <jimble-icon name="ellipsis-horizontal"></jimble-icon>
              </jimble-button>
              <jimble-menu-item value="edit">編集</jimble-menu-item>
              <jimble-menu-item value="copy">複製</jimble-menu-item>
              <jimble-menu-separator></jimble-menu-separator>
              <jimble-menu-item value="cancel" variant="danger">取り消す</jimble-menu-item>
            </jimble-dropdown-menu>
          </jimble-table-cell>
        </jimble-table-row>
        <jimble-table-row>
          <jimble-table-cell header><a href="#">#1022</a></jimble-table-cell>
          <jimble-table-cell>鈴木 一郎</jimble-table-cell>
          <jimble-table-cell><jimble-badge variant="neutral">取消</jimble-badge></jimble-table-cell>
          <jimble-table-cell align="end">¥58,000</jimble-table-cell>
          <jimble-table-cell align="end">
            <jimble-dropdown-menu placement="bottom-end" label="#1022 の操作">
              <jimble-button
                slot="trigger"
                variant="ghost"
                size="sm"
                icon-only
                aria-label="#1022 の操作"
              >
                <jimble-icon name="ellipsis-horizontal"></jimble-icon>
              </jimble-button>
              <jimble-menu-item value="edit">編集</jimble-menu-item>
              <jimble-menu-item value="copy">複製</jimble-menu-item>
              <jimble-menu-separator></jimble-menu-separator>
              <jimble-menu-item value="cancel" variant="danger">取り消す</jimble-menu-item>
            </jimble-dropdown-menu>
          </jimble-table-cell>
        </jimble-table-row>
      </jimble-table-body>
    </jimble-table>

    <div slot="footer">
      <jimble-pagination page="1" total="243" page-size="20" size="sm"></jimble-pagination>
    </div>
  </jimble-card>
</jimble-app-shell>
