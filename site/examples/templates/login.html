<!-- title: ログイン（画面の中央のカード。app-shell を使わない） -->
<!-- frame: 640 -->
<main
  style="
    display: grid;
    place-items: center;
    min-height: 100dvh;
    padding: 1.5rem;
    box-sizing: border-box;
  "
>
  <jimble-card style="width: 100%; max-width: 24rem">
    <h1 slot="header" style="margin: 0; font-size: 1.25rem">jimble 管理画面にログイン</h1>
    <form
      onsubmit="
        event.preventDefault()
        JimbleUI.toast.success('ログインしました')
      "
    >
      <jimble-stack>
        <jimble-field label="メールアドレス" required>
          <jimble-input name="email" type="email" autocomplete="username"></jimble-input>
        </jimble-field>
        <jimble-field label="パスワード" required>
          <jimble-input
            name="password"
            type="password"
            autocomplete="current-password"
          ></jimble-input>
        </jimble-field>
        <jimble-checkbox name="remember">ログインしたままにする</jimble-checkbox>
        <jimble-button type="submit" variant="primary" block>ログイン</jimble-button>
        <a href="#" style="align-self: center">パスワードを忘れた場合</a>
      </jimble-stack>
    </form>
  </jimble-card>
</main>
