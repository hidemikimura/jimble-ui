<!-- title: 基本（左に未選択、右に選択済み） -->
<jimble-field label="タグ選択" hint="行をクリックして選び、「追加」「削除」で移します">
  <jimble-dual-listbox name="tags" value="ga,test">
    <jimble-option value="ga" keywords="じーえー">GA タグ - header 要素の最初に追加</jimble-option>
    <jimble-option value="test">test - body 要素の最初に追加</jimble-option>
    <jimble-option value="verify">検証タグ - header 要素の最初に追加</jimble-option>
    <jimble-option value="cv">AdConnect CV タグ - header 要素の最初に追加</jimble-option>
    <jimble-option value="lp">all_lp - body 要素の最初に追加</jimble-option>
    <jimble-option value="confirm">all_confirm - body 要素の最後に追加</jimble-option>
    <jimble-option value="upsell">all_upsell - header 要素の最初に追加</jimble-option>
    <jimble-option value="complete" disabled>all_complete - 停止中</jimble-option>
  </jimble-dual-listbox>
</jimble-field>
