<!-- title: 候補のグループ分け（group） -->
<jimble-field
  label="都市"
  hint="見出しごとにまとまります。矢印キーは見出しを飛ばして候補を移動します"
>
  <jimble-combobox name="city" placeholder="都市を選択">
    <jimble-option value="tokyo" group="関東" keywords="とうきょう">東京</jimble-option>
    <jimble-option value="osaka" group="関西" keywords="おおさか">大阪</jimble-option>
    <jimble-option value="yokohama" group="関東" keywords="よこはま">横浜</jimble-option>
    <jimble-option value="kyoto" group="関西" keywords="きょうと">京都</jimble-option>
    <jimble-option value="sapporo" group="北海道" keywords="さっぽろ">札幌</jimble-option>
    <jimble-option value="other">その他</jimble-option>
  </jimble-combobox>
</jimble-field>
