<!-- title: 折り返しと改行（multiline） -->
<div class="row">
  <jimble-tooltip
    multiline
    text="1 ページに表示する件数を変更します。&#10;50 件を超えると、表示に時間がかかることがあります。"
  >
    <jimble-button>表示件数</jimble-button>
  </jimble-tooltip>
  <jimble-tooltip text="改行なし（既定）は 1 行のまま表示します">
    <jimble-button>1 行</jimble-button>
  </jimble-tooltip>
</div>
