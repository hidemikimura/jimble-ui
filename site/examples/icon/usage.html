<!-- title: ボタン・文字と組み合わせる（label と装飾） -->
<div class="stack">
  <div class="row">
    <jimble-button variant="primary">
      <jimble-icon slot="prefix" name="plus" size="sm"></jimble-icon>
      追加
    </jimble-button>
    <jimble-button aria-label="削除">
      <jimble-icon name="trash"></jimble-icon>
    </jimble-button>
    <jimble-button aria-label="設定">
      <jimble-icon name="cog-6-tooth"></jimble-icon>
    </jimble-button>
  </div>
  <p class="row">
    <jimble-icon name="bell" label="未読の通知"></jimble-icon>
    <span>3 件</span>
  </p>
</div>
