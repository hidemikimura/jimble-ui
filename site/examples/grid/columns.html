<!-- title: 列の数を決める（2 列のフォーム） -->
<jimble-grid columns="2" gap="4">
  <jimble-field label="姓"
    ><jimble-input name="family-name" autocomplete="family-name"></jimble-input
  ></jimble-field>
  <jimble-field label="名"
    ><jimble-input name="given-name" autocomplete="given-name"></jimble-input
  ></jimble-field>
  <jimble-field label="郵便番号"
    ><jimble-input name="postal-code" autocomplete="postal-code"></jimble-input
  ></jimble-field>
  <jimble-field label="都道府県"
    ><jimble-input name="region" autocomplete="address-level1"></jimble-input
  ></jimble-field>
</jimble-grid>
