<!-- title: 縦に並べる（フォームの項目）と、横に並べる（ボタン） -->
<jimble-stack gap="4">
  <jimble-field label="氏名">
    <jimble-input name="name" autocomplete="name"></jimble-input>
  </jimble-field>
  <jimble-field label="メールアドレス">
    <jimble-input name="email" type="email" autocomplete="email"></jimble-input>
  </jimble-field>
  <jimble-stack direction="horizontal" gap="2" justify="end">
    <jimble-button>取り消す</jimble-button>
    <jimble-button variant="primary">保存</jimble-button>
  </jimble-stack>
</jimble-stack>
