<!-- title: 空の状態（empty スロットに jimble-empty-state を置く） -->
<jimble-table label="予約">
  <jimble-table-header>
    <jimble-table-row>
      <jimble-table-head-cell>番号</jimble-table-head-cell>
      <jimble-table-head-cell>顧客</jimble-table-head-cell>
      <jimble-table-head-cell>日時</jimble-table-head-cell>
    </jimble-table-row>
  </jimble-table-header>
  <jimble-table-body></jimble-table-body>
  <jimble-empty-state slot="empty" heading="該当する予約はありません" level="3">
    <span slot="description">絞り込みの条件を外すと、すべての予約が表示されます。</span>
    <jimble-button slot="actions" size="sm">絞り込みを解除</jimble-button>
  </jimble-empty-state>
</jimble-table>
