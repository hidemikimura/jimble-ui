<!-- title: まだ何もない一覧（最初の 1 件を作る操作つき） -->
<jimble-card>
  <jimble-empty-state
    heading="注文はまだありません"
    description="注文を受け付けると、ここに一覧で表示されます。"
  >
    <jimble-icon slot="icon" name="inbox" size="lg"></jimble-icon>
    <jimble-button slot="actions" variant="primary">
      <jimble-icon slot="prefix" name="plus"></jimble-icon>注文を登録
    </jimble-button>
    <jimble-button slot="actions">CSV から取り込む</jimble-button>
  </jimble-empty-state>
</jimble-card>
