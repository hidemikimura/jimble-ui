<!-- title: 基本と自動で伸びる高さ -->
<div class="stack">
  <jimble-field label="コメント" hint="Enter は改行です">
    <jimble-textarea name="comment" rows="3"></jimble-textarea>
  </jimble-field>
  <jimble-field label="自動で伸びる（autosize）">
    <jimble-textarea name="note" rows="2" autosize></jimble-textarea>
  </jimble-field>
</div>
