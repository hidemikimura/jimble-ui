<!-- title: 済の段階を選んで戻る（navigable。value はアプリが変える） -->
<jimble-stepper id="stepper-nav" label="予約の登録" value="date" navigable>
  <jimble-step value="shop">店舗</jimble-step>
  <jimble-step value="plan">プラン</jimble-step>
  <jimble-step value="date">日時</jimble-step>
  <jimble-step value="confirm">確認</jimble-step>
</jimble-stepper>
<script>
  const stepper = document.getElementById('stepper-nav')
  stepper.addEventListener('jimble-step-change', (e) => (stepper.value = e.detail.value))
</script>
