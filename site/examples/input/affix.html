<!-- title: 前後の装飾（prefix / suffix） -->
<div class="stack">
  <jimble-input aria-label="金額" type="number" placeholder="0">
    <span slot="prefix" aria-hidden="true">¥</span>
    <span slot="suffix">円</span>
  </jimble-input>
  <jimble-input aria-label="ウェブサイト" placeholder="example.com">
    <span slot="prefix">https://</span>
  </jimble-input>
</div>
