<!-- title: 種類（type） -->
<div class="stack">
  <jimble-input aria-label="メール" type="email" placeholder="taro@example.com"></jimble-input>
  <jimble-input
    aria-label="パスワード"
    type="password"
    placeholder="8 文字以上"
    minlength="8"
  ></jimble-input>
  <jimble-input aria-label="検索" type="search" placeholder="キーワード"></jimble-input>
  <jimble-input aria-label="数量" type="number" min="0" max="99" value="1"></jimble-input>
</div>
