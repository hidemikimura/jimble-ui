name: Release

# main に入った変更から、release-please が「リリース PR」を作る(バージョンと CHANGELOG の更新)。
# リリース PR をマージすると、タグと GitHub Release が作られ、続けて npm へ公開する。
on:
  push:
    branches: [main]
  # 公開のジョブだけが止まった・失敗したときに、タグを指定して公開をやり直す。
  # 「失敗したジョブの再実行」は、release-please が「リリースは作成済み」と判断するので、publish が飛ばされる。
  workflow_dispatch:
    inputs:
      tag:
        description: '公開するタグ(例: v0.4.0)。npm にまだ無いバージョンだけ公開できる'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # release-please のジョブが飛ばされる手動実行でも走るよう、always() を付ける
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm の Trusted Publishing(OIDC)と provenance に必要
    steps:
      - uses: actions/checkout@v7
        with:
          # 手動実行のときは、指定したタグのソースを公開する
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm 11.5.1 以上(Trusted Publishing)を含む
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # 公開前の検証(CI と同じ内容 + 配布物のスモークテスト)
      - run: npm run gen:tokens:check && npm run gen:icons:check
      - run: npm run gen:manifest && npm run gen:skill:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check-dist
      - run: npm run check-package
      - run: npm run pack-smoke
      # npm の Trusted Publishing(OIDC)で認証するので、トークンは使わない。
      # 0.1.0 の公開後に、npm 側で Trusted Publisher(release.yml)を設定済み。
      # 使えなくなった場合だけ、NPM_TOKEN(Automation トークン)を設定して次の env のコメントを外す(docs/release.md を参照)。
      - run: npm publish --provenance --access public --ignore-scripts
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
