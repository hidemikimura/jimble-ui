name: Release

# main に入った変更から、release-please が「リリース PR」を作る(バージョンと CHANGELOG の更新)。
# リリース PR をマージすると、タグと GitHub Release が作られ、続けて npm へ公開する。
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm の Trusted Publishing(OIDC)と provenance に必要
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5.1 以上(Trusted Publishing)を含む
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # 公開前の検証(CI と同じ内容 + 配布物のスモークテスト)
      - run: npm run gen:tokens:check && npm run gen:icons:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check-dist
      - run: npm run check-package
      - run: npm run pack-smoke
      # npm の Trusted Publishing(OIDC)で認証するので、トークンは使わない。
      # 0.1.0 の公開後に、npm 側で Trusted Publisher(release.yml)を設定済み。
      # 使えなくなった場合だけ、NPM_TOKEN(Automation トークン)を設定して次の env のコメントを外す(docs/release.md を参照)。
      - run: npm publish --provenance --access public --ignore-scripts
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
